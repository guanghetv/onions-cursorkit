# 最小 GitLab CI 根配置（业务仓库尚无 .gitlab-ci.yml 时）
# Agent 在用户确认后可作为 .gitlab-ci.yml 写入。
# 已有 CI 时勿整文件覆盖：只合并 workflow / stages / include。

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - .post

include:
  - local: .gitlab/ci/aicr-mr-coverage.yml
